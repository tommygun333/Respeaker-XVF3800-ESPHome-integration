# =============================================================================
# Respeaker XVF3800 satellite — hardware package
#
# Board-fixed configuration: I2S buses and pins, microphone, speaker chain,
# the XMOS XVF3800 DSP, and the TLV320AIC3104 codec.
#
# Do not change the pins. They are fixed by the board layout.
# =============================================================================

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
    # i2s_mclk_pin:
    #   number: GPIO9
    #   allow_other_uses: true

  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
    # i2s_mclk_pin:
    #   number: GPIO9
    #   allow_other_uses: true

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  # Hardware speaker output
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO44
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: aic3104_dac

  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # Virtual speakers to resample each pipelines' audio, if necessary, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false


respeaker_xvf3800:
  id: respeaker
  address: 0x2C
  mute_switch:
    id: mic_mute_switch
    name: "Microphone Mute"
    update_interval: 1s
    on_turn_on:
      - if:
          condition:
            and:
              - lambda: return !id(init_in_progress);
              - switch.is_on: mute_sound
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: "mute_switch_on_sound"
    on_turn_off:
      - if:
          condition:
            and:
              - lambda: return !id(init_in_progress);
              - switch.is_on: mute_sound
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: "mute_switch_off_sound"
  dfu_version:
    name: "Firmware Version"
    update_interval: 120s
  led_beam_sensor:
    name: "Voice Beam Direction"
    id: beam_direction
    internal: true
    # One non-blocking read per poll. The DSP answers CTRL_WAIT during silence;
    # the next poll is the retry, so keep this fast enough to track a speaker.
    # This poll is also the azimuth source for beam lock. Set update_interval to
    # never, and the Beam lock switch stops working.
    update_interval: 100ms
  firmware:
    url: https://github.com/tommygun333/Respeaker-XVF3800-ESPHome-integration/raw/${respeaker_ref}/application_xvf3800_inthost-lr48-sqr-i2c-v1.0.7-release.bin
    version: "1.0.7"
    md5: 043a848f544ff2c7265ac19685daf5de

audio_dac:
  - platform: aic3104
    id: aic3104_dac
    i2c_id: internal_i2c

# Custom amplifier control switch - turns off amplifier when not in use
# This reduces background hum when the speaker is idle
switch:
  - platform: template
    name: "Amplifier Enable"
    id: amplifier_enable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    internal: false
    icon: mdi:amplifier
    entity_category: config
    turn_on_action:
      then:
        - lambda: |-
            uint8_t payload[] = {20, 1, 2, 31, 0};
            id(respeaker).write(payload, sizeof(payload));
            ESP_LOGI("amplifier", "Amplifier ENABLED");
    turn_off_action:
      then:
        - lambda: |-
            uint8_t payload[] = {20, 1, 2, 31, 1};
            id(respeaker).write(payload, sizeof(payload));
            ESP_LOGI("amplifier", "Amplifier DISABLED (no hum)");

  # Diagnostic controls for isolating post-processor echo suppression. State
  # comes from XVF3800 readback rather than optimistic/restore-value tracking.
  - platform: template
    id: pp_echo_on
    name: "XVF3800 Echo Suppression"
    icon: mdi:echo
    entity_category: config
    lambda: return id(respeaker).get_pp_echo_on();
    turn_on_action:
      - lambda: id(respeaker).set_pp_echo_on(true);
    turn_off_action:
      - lambda: id(respeaker).set_pp_echo_on(false);

  - platform: template
    id: pp_nl_atten_on
    name: "XVF3800 Nonlinear Echo Attenuation"
    icon: mdi:waveform
    entity_category: config
    lambda: return id(respeaker).get_pp_nl_atten_on();
    turn_on_action:
      - lambda: id(respeaker).set_pp_nl_atten_on(true);
    turn_off_action:
      - lambda: id(respeaker).set_pp_nl_atten_on(false);


select:
  - platform: template
    id: pp_dt_sensitive
    name: "XVF3800 Double-Talk Sensitivity"
    icon: mdi:account-voice
    entity_category: config
    update_interval: 5s
    options:
      - "0"
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      - "10"
      - "11"
      - "12"
      - "13"
      - "14"
      - "15"
    lambda: return id(respeaker).get_pp_dt_sensitive();
    set_action:
      - lambda: |-
          const int32_t value = x.size() == 2 ? 10 + (x[1] - '0') : x[0] - '0';
          id(respeaker).set_pp_dt_sensitive(value);


number:
  # PP_MGSCALE is one atomic (max,min,current) tuple in XMOS. The component
  # performs read-modify-write and preserves whether current was max or min.
  - platform: template
    id: pp_mgscale_max
    name: "XVF3800 MGSCALE Max"
    icon: mdi:tune-vertical
    entity_category: config
    update_interval: 5s
    min_value: 1
    max_value: 100000
    step: 1
    mode: box
    lambda: return id(respeaker).get_pp_mgscale_max();
    set_action:
      - lambda: id(respeaker).set_pp_mgscale_max(x);

  - platform: template
    id: pp_mgscale_min
    name: "XVF3800 MGSCALE Min"
    icon: mdi:tune-vertical
    entity_category: config
    update_interval: 5s
    min_value: 0
    max_value: 100000
    step: 0.05
    mode: box
    lambda: return id(respeaker).get_pp_mgscale_min();
    set_action:
      - lambda: id(respeaker).set_pp_mgscale_min(x);

  - platform: template
    id: pp_min_ns
    name: "XVF3800 Stationary Noise Gain Floor"
    icon: mdi:waveform
    entity_category: config
    update_interval: 5s
    min_value: 0
    max_value: 1
    step: 0.01
    mode: slider
    lambda: return id(respeaker).get_pp_min_ns();
    set_action:
      - lambda: id(respeaker).set_pp_min_ns(x);

  - platform: template
    id: pp_min_nn
    name: "XVF3800 Non-Stationary Noise Gain Floor"
    icon: mdi:waveform
    entity_category: config
    update_interval: 5s
    min_value: 0
    max_value: 1
    step: 0.01
    mode: slider
    lambda: return id(respeaker).get_pp_min_nn();
    set_action:
      - lambda: id(respeaker).set_pp_min_nn(x);

  - platform: template
    id: pp_gamma_e
    name: "XVF3800 Echo Gamma E"
    icon: mdi:sine-wave
    entity_category: config
    update_interval: 5s
    min_value: 0
    max_value: 2
    step: 0.1
    mode: slider
    lambda: return id(respeaker).get_pp_gamma_e();
    set_action:
      - lambda: id(respeaker).set_pp_gamma_e(x);

  - platform: template
    id: pp_gamma_etail
    name: "XVF3800 Echo Gamma E Tail"
    icon: mdi:sine-wave
    entity_category: config
    update_interval: 5s
    min_value: 0
    max_value: 2
    step: 0.1
    mode: slider
    lambda: return id(respeaker).get_pp_gamma_etail();
    set_action:
      - lambda: id(respeaker).set_pp_gamma_etail(x);

  - platform: template
    id: pp_gamma_enl
    name: "XVF3800 Echo Gamma ENL"
    icon: mdi:sine-wave
    entity_category: config
    update_interval: 5s
    min_value: 0
    max_value: 5
    step: 0.1
    mode: slider
    lambda: return id(respeaker).get_pp_gamma_enl();
    set_action:
      - lambda: id(respeaker).set_pp_gamma_enl(x);


binary_sensor:
  - platform: template
    name: "XVF3800 AEC Converged"
    icon: mdi:check-decagram
    entity_category: diagnostic
    lambda: return id(respeaker).get_aec_converged();

  - platform: template
    name: "XVF3800 AEC Path Change"
    icon: mdi:swap-horizontal
    entity_category: diagnostic
    lambda: return id(respeaker).get_aec_path_change();

  - platform: template
    name: "XVF3800 ASR Output Enabled"
    icon: mdi:microphone-message
    entity_category: diagnostic
    lambda: return id(respeaker).get_aec_asr_output_on();


sensor:
  - platform: template
    name: "XVF3800 MGSCALE Current"
    icon: mdi:tune-vertical
    entity_category: diagnostic
    update_interval: 5s
    accuracy_decimals: 3
    lambda: return id(respeaker).get_pp_mgscale_current();

  - platform: template
    name: "XVF3800 ASR Output Gain"
    icon: mdi:amplifier
    entity_category: diagnostic
    update_interval: 5s
    accuracy_decimals: 3
    lambda: return id(respeaker).get_aec_asr_output_gain();

  - platform: template
    name: "XVF3800 Microphone Gain"
    icon: mdi:microphone-plus
    entity_category: diagnostic
    update_interval: 5s
    accuracy_decimals: 3
    lambda: return id(respeaker).get_audio_mgr_mic_gain();

  - platform: template
    name: "XVF3800 Reference Gain"
    icon: mdi:volume-plus
    entity_category: diagnostic
    update_interval: 5s
    accuracy_decimals: 3
    lambda: return id(respeaker).get_audio_mgr_ref_gain();

  - platform: template
    name: "XVF3800 System Delay"
    icon: mdi:timer-sand
    entity_category: diagnostic
    update_interval: 5s
    accuracy_decimals: 0
    unit_of_measurement: samples
    lambda: return id(respeaker).get_audio_mgr_sys_delay();


text_sensor:
  - platform: template
    name: "XVF3800 Output Left"
    icon: mdi:audio-input-stereo-minijack
    entity_category: diagnostic
    update_interval: 5s
    lambda: return id(respeaker).get_audio_mgr_op_l();

  - platform: template
    name: "XVF3800 Output Right"
    icon: mdi:audio-input-stereo-minijack
    entity_category: diagnostic
    update_interval: 5s
    lambda: return id(respeaker).get_audio_mgr_op_r();
