# =============================================================================
# Respeaker XVF3800 satellite — voice assistant package
#
# Wake word detection, the Home Assistant voice pipeline, the media player
# chain, and the notification sounds.
#
# Includes voice timing diagnostics:
#   WAKE_DETECTED
#   WAKE_SOUND_REQUEST
#   WAKE_SOUND_PLAYING
#   WAKE_SOUND_END
#   VA_START_REQUEST
#   VA_STARTED
#   LISTENING
#   VAD_START
#   VAD_END
#   STT_END
#
# The sound URLs are substitutions. Override any of them to use your own files.
# =============================================================================

substitutions:
  # Substitutions for audio files
  mute_switch_on_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_on.flac
  mute_switch_off_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_off.flac
  timer_finished_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
  wake_word_triggered_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac
  center_button_press_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/center_button_press.flac
  center_button_double_press_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/center_button_double_press.flac
  center_button_triple_press_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/center_button_triple_press.flac
  center_button_long_press_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/center_button_long_press.flac
  factory_reset_initiated_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/factory_reset_initiated.mp3
  factory_reset_cancelled_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/factory_reset_cancelled.mp3
  factory_reset_confirmed_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/factory_reset_confirmed.mp3
  error_cloud_expired_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/error_cloud_expired.mp3


# =============================================================================
# Voice timing diagnostics
# =============================================================================

globals:
  - id: voice_dbg_wake_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: voice_dbg_wake_sound_request_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: voice_dbg_wake_sound_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: voice_dbg_va_request_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: voice_dbg_listening_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: voice_dbg_vad_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Wake sound state:
  #   0 = no wake sound pending/playing
  #   1 = wake sound requested, waiting for playback
  #   2 = wake sound is actually playing
  #
  # A 3-state value is used instead of bool because play_sound with
  # priority=true first stops the previous announcement. That stop can
  # produce an idle event before the new wake sound actually begins.
  - id: voice_dbg_wake_sound_state
    type: uint8_t
    restore_value: no
    initial_value: '0'


# Add native ESPHome voice-assistant debug messages too.
# In particular, this lets us see ESPHome's own microphone/streaming
# state transitions.
logger:
  logs:
    voice_timing: INFO
    xvf_dsp: INFO
    voice_assistant: DEBUG


number:
  # Applies only while the local wake acknowledgement is playing. The mixer
  # source is restored to 0 dB reduction before voice capture starts, so TTS
  # and timer announcements retain their normal level.
  - platform: template
    id: wake_sound_attenuation
    name: "Wake Sound Attenuation"
    icon: mdi:volume-minus
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 12
    min_value: 0
    max_value: 30
    step: 1
    mode: slider
    unit_of_measurement: dB


switch:
  # Mute Sound Switch.
  - platform: template
    id: mute_sound
    name: Mute-unmute sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Wake Word Sound Switch.
  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Beam Lock. When on, the XVF3800 beam is pinned to the wake-word direction
  # for the duration of command capture (released on STT VAD end).
  # Off by default because fixed-beam mode is a behavioural change worth
  # opting into deliberately.
  - platform: template
    id: beam_lock_enabled
    name: Beam lock
    icon: "mdi:target-account"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF


select:
  - platform: template
    name: "Wake word sensitivity"
    id: wake_word_sensitivity
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      # Sets specific wake word probabilities computed for each particular model.
      # Probability cutoffs are set as a quantized uint8 value.
      #
      # False Accepts per Hour values are tested against all units and channels
      # from the Dinner Party Corpus.
      #
      # These cutoffs apply only to the specific models included in the firmware:
      # okay_nabu@20241226.3, hey_jarvis@v2, hey_mycroft@v2
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);    // 0.85 -> 0.000 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(247);   // 0.97 -> 0.563 FAPH on DipCo
          id(hey_mycroft).set_probability_cutoff(253);  // 0.99 -> 0.567 FAPH on DipCo
        } else if (x == "Moderately sensitive") {
          id(okay_nabu).set_probability_cutoff(176);    // 0.69 -> 0.376 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(235);   // 0.92 -> 0.939 FAPH on DipCo
          id(hey_mycroft).set_probability_cutoff(242);  // 0.95 -> 1.502 FAPH on DipCo
        } else if (x == "Very sensitive") {
          id(okay_nabu).set_probability_cutoff(143);    // 0.56 -> 0.751 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(212);   // 0.83 -> 1.502 FAPH on DipCo
          id(hey_mycroft).set_probability_cutoff(237);  // 0.93 -> 1.878 FAPH on DipCo
        }


audio_file:
  - id: mute_switch_on_sound
    file: ${mute_switch_on_sound_file}

  - id: mute_switch_off_sound
    file: ${mute_switch_off_sound_file}

  - id: timer_finished_sound
    file: ${timer_finished_sound_file}

  - id: wake_word_triggered_sound
    file: ${wake_word_triggered_sound_file}

  - id: error_cloud_expired
    file: ${error_cloud_expired_sound_file}


media_source:
  - platform: audio_file
    id: audio_file_announcement_source

  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000

  - platform: audio_http
    id: http_media_source
    buffer_size: 500000

  - platform: sendspin
    id: sendspin_media_source
    fixed_delay: 480 microseconds
    # The AIC3204 DAC used, as configured, on the VPE delays audio
    # by 480 microseconds.


media_player:
  - platform: sendspin
    id: sendspin_group_media_player

  - platform: speaker_source
    id: external_media_player
    name: Media Player

    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      speaker: announcement_resampling_speaker
      sources:
        - audio_file_announcement_source
        - http_announcement_source

    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: media_resampling_speaker
      sources:
        - http_media_source
        - sendspin_media_source

    volume_increment: 0.05
    volume_min: 0.0
    volume_max: 1.0

    on_mute:
      - delay: 100ms
      - script.execute: control_leds_volume_changed

    on_unmute:
      - delay: 100ms
      - script.execute: control_leds_volume_changed

    on_volume:
      if:
        condition:
          - lambda: return !id(init_in_progress);
        then:
          - delay: 100ms
          - script.execute: control_leds_volume_changed

    on_announcement:
      # -----------------------------------------------------------------------
      # Timing diagnostic:
      # If this announcement is the wake sound we just requested, record the
      # point at which the media player actually begins playing it.
      # -----------------------------------------------------------------------
      - lambda: |-
          if (id(voice_dbg_wake_sound_state) == 1) {
            id(voice_dbg_wake_sound_start_ms) = millis();
            id(voice_dbg_wake_sound_state) = 2;

            ESP_LOGI(
              "voice_timing",
              "WAKE_SOUND_PLAYING t=%u ms wake_delta=%u ms request_delta=%u ms",
              id(voice_dbg_wake_sound_start_ms),
              id(voice_dbg_wake_sound_start_ms) - id(voice_dbg_wake_ms),
              id(voice_dbg_wake_sound_start_ms) - id(voice_dbg_wake_sound_request_ms)
            );
          }

      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s

      # Turn on amplifier when announcement starts.
      - switch.turn_on: amplifier_enable

    # Normal media playback does not use the announcement pipeline, so it
    # needs to enable the amplifier independently.
    on_play:
      - switch.turn_on: amplifier_enable

    on_idle:
      # -----------------------------------------------------------------------
      # Timing diagnostic:
      # Only treat idle as WAKE_SOUND_END if we already observed the wake
      # announcement actually starting.
      # -----------------------------------------------------------------------
      - lambda: |-
          if (id(voice_dbg_wake_sound_state) == 2) {
            const uint32_t now = millis();

            ESP_LOGI(
              "voice_timing",
              "WAKE_SOUND_END t=%u ms wake_delta=%u ms play_duration=%u ms",
              now,
              now - id(voice_dbg_wake_ms),
              now - id(voice_dbg_wake_sound_start_ms)
            );

            id(voice_dbg_wake_sound_state) = 0;
          }

    on_state:
      if:
        condition:
          and:
            - switch.is_off: timer_ringing
            - not:
                voice_assistant.is_running:
            - not:
                media_player.is_announcing: external_media_player
            - not:
                media_player.is_playing: external_media_player
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s

          # Turn off amplifier when no more audio is playing.
          # 2s grace period avoids pops.
          - delay: 2s

          - if:
              condition:
                and:
                  - not:
                      media_player.is_announcing: external_media_player
                  - not:
                      media_player.is_playing: external_media_player
                  - not:
                      voice_assistant.is_running:
              then:
                - switch.turn_off: amplifier_enable


micro_wake_word:
  id: mww

  microphone:
    microphone: i2s_mics
    channels: 1
    # gain_factor: 4

  stop_after_detection: false

  models:
    - model: https://github.com/OHF-Voice/micro-wake-word/releases/download/okay_nabu_20241226.3/okay_nabu.json
      # probability_cutoff: 0.8
      id: okay_nabu

    - model: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/refs/heads/main/microwakeword/models/v2/kenobi.json
      id: kenobi

    - model: hey_jarvis
      id: hey_jarvis

    - model: hey_mycroft
      id: hey_mycroft

    - model: https://github.com/OHF-Voice/micro-wake-word/releases/download/stop/stop.json
      id: stop
      internal: true

  vad:
    probability_cutoff: 0.05

  on_wake_word_detected:
    # -------------------------------------------------------------------------
    # TIMING ZERO POINT
    #
    # Everything else is measured relative to this millis() value.
    # -------------------------------------------------------------------------
    - lambda: |-
        id(voice_dbg_wake_ms) = millis();

        id(voice_dbg_wake_sound_request_ms) = 0;
        id(voice_dbg_wake_sound_start_ms) = 0;
        id(voice_dbg_va_request_ms) = 0;
        id(voice_dbg_listening_ms) = 0;
        id(voice_dbg_vad_start_ms) = 0;
        id(voice_dbg_wake_sound_state) = 0;

        ESP_LOGI(
          "voice_timing",
          "WAKE_DETECTED t=%u ms word='%s'",
          id(voice_dbg_wake_ms),
          wake_word.c_str()
        );

    # Turn on amplifier before anything plays.
    - switch.turn_on: amplifier_enable

    # If the wake word is detected when the device is muted
    # (possible with the software mute switch): Do nothing.
    - if:
        condition:
          switch.is_off: mic_mute_switch
        then:
          - script.execute:
              id: send_wake_word_event
              wake_word: !lambda return wake_word;

          # If a timer is ringing: Stop it, do not start the voice assistant.
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing

              # Stop voice assistant if running.
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      - voice_assistant.stop:

                    # Stop any other media player announcement.
                    else:
                      - if:
                          condition:
                            media_player.is_announcing:
                              id: external_media_player
                          then:
                            - media_player.stop:
                                announcement: true
                                id: external_media_player

                          # Start the voice assistant and play the wake sound,
                          # if enabled.
                          else:
                            - if:
                                condition:
                                  switch.is_on: wake_sound
                                then:
                                  # -------------------------------------------------
                                  # Record when we REQUEST wake-sound playback.
                                  # -------------------------------------------------
                                  - lambda: |-
                                      id(voice_dbg_wake_sound_request_ms) = millis();
                                      id(voice_dbg_wake_sound_state) = 1;

                                      ESP_LOGI(
                                        "voice_timing",
                                        "WAKE_SOUND_REQUEST t=%u ms wake_delta=%u ms",
                                        id(voice_dbg_wake_sound_request_ms),
                                        id(voice_dbg_wake_sound_request_ms) - id(voice_dbg_wake_ms)
                                      );

                                      // Log the latest cached XVF3800 state
                                      // without adding I2C latency to wake handling.
                                      id(respeaker).log_dsp_diagnostics();

                                  - mixer_speaker.apply_ducking:
                                      id: announcement_mixing_input
                                      decibel_reduction: !lambda return id(wake_sound_attenuation).state;
                                      duration: 0s

                                  - script.execute:
                                      id: play_sound
                                      priority: true
                                      sound_file: "wake_word_triggered_sound"

                                  # Wait for the asynchronous media player to actually start the wake sound.
                                  - wait_until:
                                      condition:
                                        media_player.is_announcing:
                                          id: external_media_player
                                      timeout: 500ms

                                  # Then wait for the wake sound to really finish.
                                  - wait_until:
                                      condition:
                                        not:
                                          media_player.is_announcing:
                                            id: external_media_player
                                      timeout: 2s

                                  - mixer_speaker.apply_ducking:
                                      id: announcement_mixing_input
                                      decibel_reduction: 0
                                      duration: 0s

                            # -------------------------------------------------------
                            # Record when the YAML actually requests VA startup.
                            # -------------------------------------------------------
                            - lambda: |-
                                id(voice_dbg_va_request_ms) = millis();

                                ESP_LOGI(
                                  "voice_timing",
                                  "VA_START_REQUEST t=%u ms wake_delta=%u ms",
                                  id(voice_dbg_va_request_ms),
                                  id(voice_dbg_va_request_ms) - id(voice_dbg_wake_ms)
                                );

                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;

                            # Pin the AEC beam to the wake-word direction before any
                            # other sound source can steal it. Gated by the
                            # user-facing switch so the feature is opt-in.
                            - if:
                                condition:
                                  switch.is_on: beam_lock_enabled
                                then:
                                  - lambda: id(respeaker).lock_beam();


voice_assistant:
  id: va

  microphone:
    microphone: i2s_mics
    channels: 0

  media_player: external_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  volume_multiplier: 1

  on_client_connected:
    - if:
        condition:
          - lambda: return id(init_in_progress);
          - switch.is_on: mic_mute_switch
        then:
          - switch.turn_off: mic_mute_switch

    - lambda: id(init_in_progress) = false;
    - micro_wake_word.start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds

  on_client_disconnected:
    - voice_assistant.stop:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: control_leds

  on_error:
    # Only set the error phase if the error code is different than
    # duplicate_wake_up_detected or stt-no-text-recognized.
    #
    # These two are ignored for a better user experience.
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds

    # If the error code is cloud-auth-failed, serve a local audio file
    # guiding the user.
    - if:
        condition:
          - lambda: return code == "cloud-auth-failed";
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: "error_cloud_expired"

  # ---------------------------------------------------------------------------
  # Assist pipeline has started.
  #
  # This is NOT necessarily identical to microphone audio actually reaching HA,
  # but lets us measure VA startup latency after voice_assistant.start.
  # ---------------------------------------------------------------------------
  on_start:
    - lambda: |-
        const uint32_t now = millis();

        if (id(voice_dbg_va_request_ms) != 0) {
          ESP_LOGI(
            "voice_timing",
            "VA_STARTED t=%u ms wake_delta=%u ms request_delta=%u ms",
            now,
            now - id(voice_dbg_wake_ms),
            now - id(voice_dbg_va_request_ms)
          );
        } else {
          ESP_LOGI(
            "voice_timing",
            "VA_STARTED t=%u ms wake_delta=%u ms",
            now,
            now - id(voice_dbg_wake_ms)
          );
        }

    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 20
        duration: 0.0s

    - switch.turn_on: amplifier_enable

  # ---------------------------------------------------------------------------
  # ESPHome reports that the voice-assistant microphone is now listening.
  # ---------------------------------------------------------------------------
  on_listening:
    - lambda: |-
        const uint32_t now = millis();
        id(voice_dbg_listening_ms) = now;

        if (id(voice_dbg_va_request_ms) != 0) {
          ESP_LOGI(
            "voice_timing",
            "LISTENING t=%u ms wake_delta=%u ms request_delta=%u ms",
            now,
            now - id(voice_dbg_wake_ms),
            now - id(voice_dbg_va_request_ms)
          );
        } else {
          ESP_LOGI(
            "voice_timing",
            "LISTENING t=%u ms wake_delta=%u ms",
            now,
            now - id(voice_dbg_wake_ms)
          );
        }

    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds

  # ---------------------------------------------------------------------------
  # HA/STT VAD has decided that speech has started.
  # ---------------------------------------------------------------------------
  on_stt_vad_start:
    - lambda: |-
        const uint32_t now = millis();
        id(voice_dbg_vad_start_ms) = now;

        if (id(voice_dbg_listening_ms) != 0) {
          ESP_LOGI(
            "voice_timing",
            "VAD_START t=%u ms wake_delta=%u ms listening_delta=%u ms",
            now,
            now - id(voice_dbg_wake_ms),
            now - id(voice_dbg_listening_ms)
          );
        } else {
          ESP_LOGI(
            "voice_timing",
            "VAD_START t=%u ms wake_delta=%u ms",
            now,
            now - id(voice_dbg_wake_ms)
          );
        }

    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    - script.execute: control_leds

  # ---------------------------------------------------------------------------
  # Speech ended according to STT VAD.
  # ---------------------------------------------------------------------------
  on_stt_vad_end:
    - lambda: |-
        const uint32_t now = millis();

        if (id(voice_dbg_vad_start_ms) != 0) {
          ESP_LOGI(
            "voice_timing",
            "VAD_END t=%u ms wake_delta=%u ms vad_duration=%u ms",
            now,
            now - id(voice_dbg_wake_ms),
            now - id(voice_dbg_vad_start_ms)
          );
        } else {
          ESP_LOGI(
            "voice_timing",
            "VAD_END t=%u ms wake_delta=%u ms",
            now,
            now - id(voice_dbg_wake_ms)
          );
        }

    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};

    # Release the beam as soon as command capture is over, so the stop-word
    # detector can still hear the user from anywhere in the room during TTS.
    - lambda: id(respeaker).unlock_beam();

    - script.execute: control_leds

  on_intent_progress:
    - if:
        condition:
          # A nonempty x variable means a streaming TTS URL was sent
          # to the media player.
          lambda: 'return !x.empty();'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds

          # Start a script that would potentially enable the stop word
          # if the response is longer than a second.
          - script.execute: activate_stop_word_once

  on_tts_start:
    - if:
        condition:
          # The intent_progress trigger didn't start the TTS response.
          lambda: 'return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds

          # Start a script that would potentially enable the stop word
          # if the response is longer than a second.
          - script.execute: activate_stop_word_once

  on_tts_end:
    - script.execute:
        id: send_tts_uri_event
        tts_uri: !lambda 'return x;'

  # ---------------------------------------------------------------------------
  # Final STT transcript plus timing from wake detection.
  # ---------------------------------------------------------------------------
  on_stt_end:
    - lambda: |-
        const uint32_t now = millis();

        ESP_LOGI(
          "voice_timing",
          "STT_END t=%u ms wake_delta=%u ms text='%s'",
          now,
          now - id(voice_dbg_wake_ms),
          x.c_str()
        );

    - script.execute:
        id: send_stt_text_event
        stt_text: !lambda 'return x;'

  # When the voice assistant ends ...
  on_end:
    # Safety-net unlock: covers paths where on_stt_vad_end never fired
    # (pipeline error mid-capture, abort, etc.). Idempotent.
    - lambda: id(respeaker).unlock_beam();

    - wait_until:
        not:
          voice_assistant.is_running:

    # Stop ducking audio.
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s

    # If the end happened because of an error, leave the error phase on
    # for a second.
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s

    # Reset the voice assistant phase ID and reset the LED animations.
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds

    # Turn off amplifier with grace period (2s) to avoid pops.
    - delay: 2s

    - if:
        condition:
          and:
            - not:
                media_player.is_announcing: external_media_player
            - not:
                media_player.is_playing: external_media_player
            - not:
                voice_assistant.is_running:
        then:
          - switch.turn_off: amplifier_enable

  on_timer_finished:
    - switch.turn_on: timer_ringing
    - lambda: |
        id(next_timer).publish_state(-1);
        id(next_timer_name).publish_state("-");

  on_timer_started:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        }

    - script.execute: control_leds

  on_timer_cancelled:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        } else {
          id(next_timer).publish_state(-1);
          id(next_timer_name).publish_state("-");
        }

    - script.execute: control_leds

  on_timer_updated:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        }

    - script.execute: control_leds

  on_timer_tick:
    # Reduce LED updates - only every 5 seconds instead of every second.
    - lambda: |
        id(fetch_first_active_timer).execute();
        int seconds_left = id(first_active_timer).seconds_left;

        if (seconds_left % 5 == 0) {
          id(next_timer).publish_state(seconds_left);
        }

        if (id(current_led_effect) == "timer_tick") {
          id(control_leds_timer_ticking).execute();
        }


script:
  # ===========================================================================
  # Script executed when we want to play sounds on the device.
  # ===========================================================================
  - id: play_sound
    parameters:
      priority: bool
      sound_file: string
    then:
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true

      - lambda: |-
          if (
            (id(external_media_player).state !=
             media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING)
            || priority
          ) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }


  # ===========================================================================
  # Script used to activate the stop word if the TTS step is long.
  #
  # Why is this wrapped in a script?
  #
  # Because we want to stop the sequence if the TTS step is faster than that.
  # This allows us to prevent having the deactivation of the stop word before
  # its own activation.
  # ===========================================================================
  - id: activate_stop_word_once
    then:
      - wait_until:
          condition:
            media_player.is_announcing:
              id: external_media_player

      - delay: 1s

      # Enable stop wake word.
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.enable_model: stop

            - wait_until:
                not:
                  media_player.is_announcing:
                    id: external_media_player

            - if:
                condition:
                  switch.is_off: timer_ringing
                then:
                  - micro_wake_word.disable_model: stop


  # ===========================================================================
  # Home Assistant events
  # ===========================================================================
  - id: send_wake_word_event
    parameters:
      wake_word: string
    then:
      - homeassistant.event:
          event: esphome.wake_word_detected
          data:
            wake_word: !lambda return wake_word;


  - id: send_alarm_event
    then:
      - homeassistant.event:
          event: esphome.alarm_ringing


  - id: send_tts_uri_event
    parameters:
      tts_uri: string
    then:
      - homeassistant.event:
          event: esphome.tts_uri
          data:
            uri: !lambda 'return tts_uri;'


  - id: send_stt_text_event
    parameters:
      stt_text: string
    then:
      - homeassistant.event:
          event: esphome.stt_text
          data:
            text: !lambda 'return stt_text;'
