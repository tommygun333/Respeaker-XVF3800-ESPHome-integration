# =============================================================================
# Respeaker XVF3800 voice satellite — example configuration
#
# This file holds only the settings that belong to your device. The rest comes
# from the packages in this repository.
#
# Before you build this file, put a secrets.yaml next to it. Copy
# secrets.yaml.example to secrets.yaml and set your own values.
# =============================================================================

substitutions:
  name: respeaker-xvf3800-assistant
  friendly_name: reSpeaker XVF3800 Assistant

  # Ref of this repository. It selects the YAML packages below, the C++
  # components, and the DFU firmware.
  #
  # Change "main" to a tag or a commit to pin the device to one version. Set
  # the same value in "ref:" below, so that the YAML and the C++ agree.
  respeaker_ref: main

packages:
  respeaker:
    url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
    ref: ${respeaker_ref}
    refresh: 1d
    files:
      - packages/base.yaml
      - packages/hardware.yaml
      - packages/voice-assistant.yaml
      - packages/leds.yaml
      - packages/timers-alarm.yaml

# A remote package cannot read secrets, so the credentials go here.
# ESPHome joins these blocks with the blocks in the packages.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

# Custom amplifier control switch - turns off amplifier when not in use
switch:
  - platform: template
    name: "Amplifier Enable"
    id: amplifier_enable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    internal: false
    turn_on_action:
      then:
        - lambda: |-
            uint8_t payload[] = {20, 1, 2, 31, 0};
            id(respeaker).write(payload, sizeof(payload));
            ESP_LOGI("amplifier", "Amplifier ENABLED");
    turn_off_action:
      then:
        - lambda: |-
            uint8_t payload[] = {20, 1, 2, 31, 1};
            id(respeaker).write(payload, sizeof(payload));
            ESP_LOGI("amplifier", "Amplifier DISABLED (no hum)");
